<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEBATE — Better ideas together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2563eb; --blue2:#3b82f6; --blue3:#60a5fa; --blueSoft:#dbeafe; --blueSoft2:#eff6ff;
    --ink:#0f172a; --sub:#64748b; --sub2:#94a3b8;
    --bg:#eef2f9; --card:#ffffff; --line:#e2e8f0; --line2:#eef2f7;
    --green:#16a34a; --greenSoft:#dcfce7; --red:#ef4444; --redSoft:#fee2e2;
    --amber:#f59e0b; --amberSoft:#fef3c7; --purple:#a855f7; --dark:#0b1220;
    --r:18px; --r2:12px;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 10px 30px -14px rgba(15,23,42,.14);
    --shadowSm:0 1px 2px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 'Inter',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer;border:0;background:none}
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--blueSoft)}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  @media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{display:none}}
  .sidebar{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line2);padding:22px 16px;display:flex;flex-direction:column;gap:6px}
  .logo{display:flex;gap:10px;align-items:center;padding:2px 6px 18px}
  .logo .mark{width:38px;height:38px;flex:none}
  .logo b{font-size:21px;font-weight:900;letter-spacing:-.02em;display:block;line-height:1}
  .logo small{color:var(--sub2);font-size:11px;font-weight:500}
  .btnPrimary{display:flex;align-items:center;gap:10px;background:var(--blue);color:#fff;font-weight:700;border-radius:14px;padding:12px 16px;box-shadow:0 6px 16px -6px rgba(37,99,235,.5);transition:.15s}
  .btnPrimary:hover{background:#1d4ed8}
  .nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
  .nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#334155;font-weight:600;font-size:14px}
  .nav a svg{width:19px;height:19px;stroke:#64748b}
  .nav a:hover{background:var(--blueSoft2)}
  .nav a.on{background:var(--blueSoft);color:var(--blue)}
  .nav a.on svg{stroke:var(--blue)}
  .sideTag{margin-top:auto;padding:10px 8px;font-weight:800;font-size:17px;line-height:1.25;color:#cbd5e1;letter-spacing:-.01em}
  main{min-width:0}

  .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:26px;padding:30px 38px 60px;max-width:1460px;margin:0 auto}
  @media(max-width:1180px){.layout{grid-template-columns:1fr}.rail{display:none}}
  .card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow)}
  .pad{padding:22px}

  /* ---------- hero ---------- */
  .hero{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(180deg,#f8fafd,#eaf1fb);border:1px solid var(--line2);box-shadow:var(--shadow)}
  .heroTop{display:grid;grid-template-columns:1.05fr .95fr;gap:10px;align-items:center;padding:38px 38px 6px}
  @media(max-width:900px){.heroTop{grid-template-columns:1fr}}
  .hero h1{margin:0;font-size:clamp(34px,4.2vw,54px);line-height:1.02;font-weight:900;letter-spacing:-.035em}
  .hero .sub{color:var(--sub);font-size:17px;margin:14px 0 0;max-width:420px}
  .heroArt svg{display:block;width:100%;height:auto}

  /* ---------- ask bar ---------- */
  .askWrap{margin:6px 38px 30px;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 44px -18px rgba(15,23,42,.18);padding:16px}
  .askRow{display:flex;align-items:center;gap:12px}
  .askRow .spark{width:34px;height:34px;border-radius:12px;background:var(--blueSoft);display:grid;place-items:center;flex:none}
  .askRow input{flex:1;border:0;outline:0;font:600 16px 'Inter',system-ui;color:var(--ink);background:transparent}
  .askRow input::placeholder{color:var(--sub2);font-weight:500}
  .goBtn{width:44px;height:44px;border-radius:14px;background:var(--blue);display:grid;place-items:center;transition:.15s;flex:none}
  .goBtn:hover{background:#1d4ed8}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:99px;padding:8px 15px;font-size:13px;font-weight:600;color:#334155;background:#fff;transition:.15s}
  .chip:hover{border-color:var(--blue3);color:var(--blue);background:var(--blueSoft2)}
  .chip svg{width:15px;height:15px;stroke:currentColor}
  .advRow{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--sub)}
  .field input,.field select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:500 14px 'Inter';color:var(--ink);outline:0;background:#fff}
  .field input:focus,.field select:focus{border-color:var(--blue3)}
  .ctxRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  @media(max-width:700px){.ctxRow{grid-template-columns:1fr}}
  .ctxRow textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:500 13.5px 'Inter';color:var(--ink);outline:0;resize:vertical;min-height:58px}
  .ctxRow textarea:focus{border-color:var(--blue3)}

  /* ---------- section headers ---------- */
  .secHead{display:flex;align-items:center;justify-content:space-between;margin:28px 2px 14px}
  .secHead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em}
  .secHead a{color:var(--sub);font-size:13px;font-weight:600;display:flex;gap:5px;align-items:center}
  .secHead a:hover{color:var(--blue)}

  /* ---------- debate cards ---------- */
  .deckGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .deck{padding:18px;cursor:pointer;transition:.15s;position:relative}
  .deck:hover{transform:translateY(-2px);box-shadow:0 14px 34px -14px rgba(15,23,42,.22)}
  .deckTop{display:flex;gap:12px;align-items:center}
  .deckIcon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:17px;flex:none}
  .deckTop b{display:block;font-size:14.5px;line-height:1.3}
  .deckTop small{color:var(--sub2);font-size:12px;font-weight:500}
  .deckBar{margin-top:14px;display:flex;align-items:center;gap:10px}
  .bar{flex:1;height:7px;border-radius:99px;background:var(--line2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue2),var(--blue))}
  .bar i.g{background:linear-gradient(90deg,#34d399,#16a34a)}
  .deckBar b{font-size:12.5px;color:#334155}
  .deckMeta{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .faces{display:flex}
  .faces span{width:24px;height:24px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;margin-left:-7px}
  .faces span:first-child{margin-left:0}
  .badge{font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:99px}
  .badge.live{background:var(--blueSoft);color:var(--blue)}
  .badge.done{background:var(--greenSoft);color:var(--green)}
  .badge.lobby{background:var(--amberSoft);color:#b45309}
  .deckSum{margin:10px 0 0;color:var(--sub);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* ---------- dark banner ---------- */
  .banner{margin-top:28px;position:relative;overflow:hidden;border-radius:20px;background:linear-gradient(120deg,#0b1220,#111d36 60%,#16294d);color:#fff;padding:30px 34px;display:flex;align-items:center;justify-content:space-between;gap:20px}
  .banner h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .banner p{margin:6px 0 0;color:#94a7c4;font-size:13.5px;max-width:430px}
  .banner .cta{background:#fff;color:var(--ink);font-weight:700;border-radius:12px;padding:12px 20px;display:flex;gap:8px;align-items:center;flex:none;position:relative;z-index:2}
  .banner .cta:hover{background:var(--blueSoft)}
  .bannerArt{position:absolute;right:210px;top:0;bottom:0;width:330px;opacity:.9;pointer-events:none}
  @media(max-width:900px){.bannerArt{display:none}}

  /* ---------- rail ---------- */
  .rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:26px;align-self:start}
  .railCard{padding:20px}
  .railHead{display:flex;justify-content:space-between;align-items:center}
  .railHead h3{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em}
  .ringWrap{display:flex;gap:18px;align-items:center;margin-top:16px}
  .ring{position:relative;width:108px;height:108px;flex:none}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring .val b{font-size:22px;font-weight:900;line-height:1}
  .ring .val small{font-size:10px;color:var(--sub);font-weight:600}
  .ringSide{font-size:13px;color:var(--sub);display:flex;flex-direction:column;gap:8px}
  .steps{margin-top:14px;display:flex;flex-direction:column;gap:2px}
  .step{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13.5px;font-weight:600;color:#475569}
  .step .dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;border:2px solid var(--line);color:var(--sub2);font-weight:700}
  .step.done .dot{background:var(--green);border-color:var(--green);color:#fff}
  .step.done{color:var(--ink)}
  .step.now .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 4px var(--blueSoft)}
  .step.now{color:var(--blue)}
  .step .pct{margin-left:auto;font-size:12px;font-weight:700;color:var(--sub2)}
  .step.now .pct{color:var(--blue)}
  .tipCard{margin-top:14px;background:var(--blueSoft2);border:1px solid #dbe7fb;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
  .tipCard .ico{width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadowSm)}
  .tipCard b{font-size:13px;display:block}
  .tipCard small{color:var(--sub);font-size:12px;line-height:1.4;display:block;margin-top:1px}

  .agentRow{display:flex;align-items:center;gap:12px;padding:9px 0}
  .agentRow .face{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center}
  .agentRow b{font-size:13.5px;display:block}
  .agentRow small{color:var(--sub);font-size:12px}
  .agentRow .st{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--green)}
  .agentRow .st i{width:7px;height:7px;border-radius:50%;background:var(--green);display:block}
  .agentRow .st.off{color:var(--sub2)} .agentRow .st.off i{background:var(--sub2)}

  .expectRow{display:flex;gap:11px;align-items:flex-start;padding:4px 0}
  .expectRow .ic{width:34px;height:34px;border-radius:11px;background:var(--blueSoft);display:grid;place-items:center;flex:none}
  .expectRow b{font-size:13.5px;display:block}
  .expectRow small{color:var(--sub);font-size:12.5px;line-height:1.45;display:block}

  /* ---------- room ---------- */
  .roomHead{display:flex;align-items:center;gap:14px}
  .backBtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;background:#fff;flex:none}
  .backBtn:hover{border-color:var(--blue3)}
  .liveChip{display:flex;align-items:center;gap:7px;background:var(--redSoft);color:var(--red);font-weight:700;font-size:12px;padding:6px 13px;border-radius:99px;flex:none}
  .liveChip i{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
  .liveChip.done{background:var(--greenSoft);color:var(--green)} .liveChip.done i{background:var(--green);animation:none}
  .liveChip.lob{background:var(--amberSoft);color:#b45309} .liveChip.lob i{background:var(--amber);animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .consenso{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .miniPills{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .miniPill{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--sub);background:#fff}
  .miniPill .n{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;border:2px solid var(--line);color:var(--sub2);font-weight:800}
  .miniPill.done{color:var(--green);border-color:#bbe7c9}
  .miniPill.done .n{background:var(--green);border-color:var(--green);color:#fff}
  .miniPill.now{color:var(--blue);border-color:var(--blue3);box-shadow:0 0 0 3px var(--blueSoft2)}
  .miniPill.now .n{border-color:var(--blue);color:var(--blue)}
  .miniPill small{display:block;font-size:10.5px;font-weight:600;color:var(--sub2)}
  .miniPill.done small,.miniPill.now small{color:inherit;opacity:.75}

  table.points{width:100%;border-collapse:collapse}
  table.points td{padding:11px 8px;border-top:1px solid var(--line2);font-size:13.5px;vertical-align:middle}
  table.points tr:first-child td{border-top:0}
  table.points .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
  table.points b{font-size:13.5px}
  table.points small{display:block;color:var(--sub2);font-size:11.5px;font-weight:500}
  .stChip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:5px 11px}
  .stChip.ok{background:var(--greenSoft);color:var(--green)}
  .stChip.disc{background:var(--amberSoft);color:#b45309}
  .stChip.new{background:var(--blueSoft);color:var(--blue)}
  .stChip.out{background:var(--line2);color:var(--sub2)}

  /* transcript */
  .msg{display:flex;gap:12px;padding:14px 4px;border-top:1px solid var(--line2)}
  .msg:first-child{border-top:0}
  .msg .face{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center}
  .msg .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .msg .who b{font-size:13.5px}
  .kindChip{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:2.5px 8px}
  .k-proposal{background:var(--blueSoft);color:var(--blue)} .k-critique{background:var(--redSoft);color:var(--red)}
  .k-revision{background:#e0e7ff;color:#4338ca} .k-vote{background:var(--line2);color:var(--sub)}
  .k-objection{background:var(--redSoft);color:#b91c1c} .k-synthesis{background:var(--greenSoft);color:var(--green)}
  .k-pass{background:var(--line2);color:var(--sub)} .k-argument{background:#fae8ff;color:#a21caf}
  .msg p{margin:5px 0 0;color:#334155;font-size:14px}
  .msg details{margin-top:8px}
  .msg summary{font-size:12px;font-weight:600;color:var(--blue);cursor:pointer}
  .msg pre{white-space:pre-wrap;font:12.5px/1.55 'Inter';color:#334155;background:var(--blueSoft2);border:1px solid #dbe7fb;border-radius:12px;padding:12px;margin:8px 0 0}
  .sysLine{display:flex;justify-content:center;padding:7px 0;border-top:1px dashed var(--line2)}
  .sysLine:first-child{border-top:0}
  .sysLine span{font-size:12px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:4px 14px}
  .sysLine.k-closed span{background:var(--greenSoft);border-color:#bbe7c9;color:var(--green)}
  .sysLine.k-timeout span{background:var(--amberSoft);border-color:#fde68a;color:#b45309}

  /* resultado */
  .resultCard{border:1.5px solid #bbe7c9;background:linear-gradient(180deg,#f4fdf7,#fff);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
  .resultCard h3{margin:0;display:flex;gap:9px;align-items:center;color:var(--green);font-size:17px;font-weight:800}
  .resultCard .win{margin:12px 0 0;font-size:14.5px}
  .resultCard .final{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;font-size:13.5px;line-height:1.6;color:#1e293b;max-height:440px;overflow:auto;margin-top:14px}
  .checksum{font-size:11.5px;color:var(--sub);word-break:break-all;font-family:ui-monospace,monospace;margin-top:12px}
  .checksum b{color:var(--blue);font-weight:700}

  /* reglas / invite */
  .rulesRow{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--line2);font-size:13px}
  .rulesRow:first-child{border-top:0}
  .rulesRow .ic{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:13px}
  .rulesRow b{display:block;font-size:12px;color:var(--ink)}
  .rulesRow small{color:var(--sub);font-size:12.5px;line-height:1.45;display:block}
  .urlBox{display:flex;align-items:center;gap:8px;background:var(--blueSoft2);border:1px solid #dbe7fb;border-radius:12px;padding:10px 12px}
  .urlBox code{flex:1;font:600 12.5px ui-monospace,monospace;color:var(--blue);word-break:break-all}
  .copyBtn{background:var(--blue);color:#fff;font-size:11.5px;font-weight:700;border-radius:9px;padding:7px 12px;flex:none}
  .copyBtn:hover{background:#1d4ed8}
  .promptTa{width:100%;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:500 12.5px/1.5 'Inter';color:#334155;resize:vertical;min-height:74px;outline:0;background:#fbfdff}
  .promptTa:focus{border-color:var(--blue3)}
  .note{display:flex;gap:9px;background:var(--blueSoft2);border-radius:12px;padding:11px 13px;font-size:12px;color:#334155;margin-top:12px}
  .note svg{flex:none;stroke:var(--blue)}

  .ghostBtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#334155}
  .ghostBtn:hover{border-color:var(--blue3);color:var(--blue)}
  .empty{text-align:center;padding:54px 20px;color:var(--sub)}
  .empty .big{font-size:40px;margin-bottom:8px}
  .footer{color:var(--sub2);font-size:12px;text-align:center;padding:26px}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="logo">
      <svg class="mark" viewBox="0 0 40 40"><path d="M20 3c7 0 13 4.6 13 11.2 0 4.5-2.7 8-6.8 9.9.5 2.5 1.8 4.7 3.8 6.4-3.2-.3-6-1.5-8.2-3.5-.6 0-1.2.1-1.8.1-7 0-13-4.7-13-11S13 3 20 3Z" fill="#2563eb"/><circle cx="14.5" cy="14" r="2.4" fill="#fff"/><circle cx="25.5" cy="14" r="2.4" fill="#fff"/><path d="M14 20.5c1.8 1.6 4 2.4 6 2.4s4.2-.8 6-2.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      <div><b>DEBATE</b><small>Better ideas together</small></div>
    </div>
    <button class="btnPrimary" onclick="go('#nuevo')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nuevo debate
    </button>
    <nav class="nav">
      <a href="#debates" data-nav="debates" onclick="navGo(event,'debates')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3c-1.5 0-3-.4-4.2-1L3 20l1.3-4.9a8 8 0 0 1-1.3-4.4A8.4 8.4 0 0 1 11.5 3.2 8.4 8.4 0 0 1 21 11.5Z"/></svg>Debates</a>
      <a href="#agentes" data-nav="agentes" onclick="navGo(event,'agentes')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Agentes</a>
      <a href="#protocolo" data-nav="protocolo" onclick="navGo(event,'protocolo')"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Protocolo</a>
    </nav>
    <div class="sideTag">Más mentes.<br>Mejores<br>resultados.</div>
  </aside>
  <main id="main"></main>
</div>

<script>
'use strict';
const $main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const PH = [
  ['lobby','Lobby'],['proposal','Propuestas'],['critique','Crítica'],['revise','Revisión'],
  ['vote','Votación'],['tiebreak','Desempate'],['objection','Vetos'],['repair','Reparación'],
  ['synthesis','Síntesis'],['closed','Resultado']];
const OPTIONAL = new Set(['tiebreak','repair']);
const CORE = PH.filter(([k])=>!OPTIONAL.has(k));

function phaseInfo(status, phase){
  if (status === 'lobby') return { idx:0, label:'Lobby' };
  if (status === 'closed') return { idx:CORE.length-1, label:'Resultado' };
  let i = CORE.findIndex(([k])=>k===phase);
  if (i < 0){ // fase opcional: anclar a su fase madre
    i = phase==='tiebreak' ? CORE.findIndex(([k])=>k==='vote') : CORE.findIndex(([k])=>k==='objection');
  }
  const label = (PH.find(([k])=>k===phase)||[,''])[1];
  return { idx:i, label };
}
const progressOf = (status, phase) => {
  const {idx} = phaseInfo(status, phase);
  return status==='closed' ? 100 : Math.round(idx/(CORE.length-1)*100);
};

const PALETTE = [

  ['#a855f7','#7e22ce'],['#06b6d4','#0e7490'],['#f97316','#c2410c'],['#ec4899','#be185d'],
  ['#10b981','#047857'],['#6366f1','#4338ca']];
function hash(s){ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))>>>0; return h; }
function faceSvg(name, size){
  const h = hash(name);
  const [c1,c2] = PALETTE[h % PALETTE.length];
  const v = h % 3;
  const extra = v===0
    ? `<path d="M9 7 L13 2 L16 6 Z M27 7 L23 2 L20 6 Z" fill="${c2}"/>`
    : v===1 ? `<rect x="17.2" y="1" width="2.6" height="7" rx="1.3" fill="${c2}"/><circle cx="18.5" cy="2.2" r="2" fill="${c2}"/>` : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 36 36">
    <defs><linearGradient id="g${h%9973}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
    ${extra}
    <rect x="5" y="8" width="26" height="25" rx="12.5" fill="url(#g${h%9973})"/>
    <circle cx="13.5" cy="19.5" r="4.4" fill="#fff"/><circle cx="22.5" cy="19.5" r="4.4" fill="#fff"/>
    <circle cx="${13.5 + (h%3) - 1}" cy="${19.5 + (h%2)}" r="2" fill="#0f172a"/>
    <circle cx="${22.5 + (h%3) - 1}" cy="${19.5 + (h%2)}" r="2" fill="#0f172a"/>
    <path d="M14 27.5c1.4 1.2 2.9 1.8 4 1.8s2.6-.6 4-1.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

  `<span class="face" style="width:${size}px;height:${size}px">${faceSvg(name,size)}</span>`;

/* ---------- utilidades ---------- */
async function jget(u){ return fetch(u).then(r=>r.json()); }
function copyText(t, btn){
  const done = () => { if(!btn) return; const o=btn.textContent; btn.textContent='¡Copiado!'; setTimeout(()=>btn.textContent=o,1200); };
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(done); else {
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch{} ta.remove();
  }
}
function agentPromptFor(url){
  return `Participa en un debate multi-agente sobre una tarea. Abre esta URL y sigue el protocolo que te devolverá: ${url}\nAl finalizar, dame el plan final y su checksum.`;
}
function navGo(e, key){
  e.preventDefault();
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('on', a.dataset.nav===key));
  const el = document.getElementById('sec-'+key); if (el) el.scrollIntoView({behavior:'smooth'});
  history.replaceState(null,'','#'+key);
}
function timeAgo(ts){
  const m = Math.round((Date.now()-ts)/60000);
  if (m < 1) return 'ahora';
  if (m < 60) return `hace ${m} min`;
  const h = Math.round(m/60); if (h < 24) return `hace ${h} h`;
  return new Date(ts).toLocaleDateString('es',{day:'numeric',month:'short'});
}

function chip(t){

  f.value = `Decide la mejor ${t.toLowerCase()} para nuestro proyecto y justifícala con un plan ejecutable.`;

async function refreshHall(){
  try{
    const r = await jget('/api/hall');
    const el = document.getElementById('hallDeck'); if(!el) return;
    if(!r.rooms.length){
      el.innerHTML = `<div class="card pad empty" style="grid-column:1/-1">
        <div class="big">🪑</div><b>Aún no hay debates</b><p style="margin:6px 0 0;font-size:13.5px">Escribe arriba «¿Sobre qué quieres debatir?» y convoca a tus agentes.</p></div>`;
      return;
    }
    el.innerHTML = r.rooms.slice(0,9).map(x=>{
      const pct = progressOf(x.status, x.phase);
      const badge = x.status==='closed' ? '<span class="badge done">Completado</span>'
        : x.status==='lobby' ? '<span class="badge lobby">Esperando agentes</span>'
        : '<span class="badge live">En curso</span>';
      return `<div class="card deck" onclick="go('/r/${esc(x.code)}')">
        <div class="deckTop">
          <span class="deckIcon" style="background:linear-gradient(135deg,${PALETTE[hash(x.code)%PALETTE.length].join(',')})">${esc(x.task.trim()[0]||'D').toUpperCase()}</span>
          <div style="min-width:0"><b>${esc(x.task)}</b><small>${x.agents} agente(s) · ${timeAgo(x.createdAt)}</small></div>
        </div>
        <div class="deckBar"><span class="bar"><i class="${x.status==='closed'?'g':''}" style="width:${pct}%"></i></span><b>${pct}%</b></div>
        <div class="deckMeta"><div class="faces"><span style="background:#3b82f6">+${x.agents}</span></div>${badge}</div>
      </div>`;
    }).join('');
  }catch{}
}

  try{ const r = await jget('/api/hall'); live = r.rooms.find(x=>x.status==='debate') || null; }catch{}
  let room = null;
  if (live){ try{ room = (await jget(`/api/rooms/${live.code}/public`)).room; }catch{} }
  const pct = room ? progressOf(room.status, room.phase) : 0;
  const {idx} = room ? phaseInfo(room.status, room.phase) : {idx:0};
  const ring = p => {
    const R=48, C=2*Math.PI*R;
    return `<svg width="108" height="108" viewBox="0 0 108 108">
      <circle cx="54" cy="54" r="${R}" fill="none" stroke="var(--line2)" stroke-width="9"/>
      <circle cx="54" cy="54" r="${R}" fill="none" stroke="url(#rg)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p/100)}"/>
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs></svg>
      <span class="val"><div><b>${p}%</b><br><small>Consenso</small></div></span>`;
  };
  const steps = CORE.slice(1, 7).map(([k,label],i)=>{
    const realIdx = i+1; // proposal..synthesis en orden CORE
    const cls = room ? (room.status==='closed' || realIdx < idx ? 'done' : realIdx === idx ? 'now' : '') : '';
    const pct = cls==='done' ? NAV_ICONS.ok : cls==='now' ? '<span style="font-size:10.5px">●</span>' : '';
    return `<div class="step ${cls}"><span class="dot">${cls==='done'?'✓':i+1}</span>${label}<span class="pct">${cls==='done'?'':cls==='now'?'en curso':''}</span></div>`;
  }).join('');
  const agentsHtml = room && room.agents.length
    ? room.agents.map(a=>{
        const online = room.status!=='closed' && (Date.now()-(a.lastSeenAt||0) < 120000);
        return `<div class="agentRow"><span class="face">${faceSvg(a.name,38)}</span>
          <div><b>${esc(a.name)}</b><small>${esc(a.model||a.harness||'agente')}</small></div>
          <span class="st ${online?'':'off'}"><i></i>${online?'Online':room.status==='closed'?'finalizó':'ausente'}</span></div>`;
      }).join('')
    : `<div class="agentRow"><span class="face" style="background:var(--bg)">${NAV_ICONS.info}</span><div><b>Sin agentes activos</b><small>entra desde una sala para verlos aquí</small></div></div>`;
  const stats = room ? `${room.proposals.length} propuestas · ${room.critiques.length} ataques · ${room.objections.length} objeciones` : '';
  rail.innerHTML = `
    <div class="card railCard">
      <div class="railHead"><h3>Consenso del debate</h3><span style="color:var(--sub2)">${NAV_ICONS.info}</span></div>
      <div class="ringWrap"><span class="ring">${ring(pct)}</span>
        <div class="ringSide">
          ${room ? `<b style="color:var(--ink);font-size:13px">${esc(room.phase==='closed'?'Finalizado':room.phase)}</b>` : ''}
          <span>${room ? 'Sube con cada fase validada' : 'Se activa cuando hay un debate en curso'}</span>
          ${room ? `<span style="color:var(--green);font-weight:700;font-size:12px;display:flex;gap:5px;align-items:center">${NAV_ICONS.trend} ${room.agents.length} agentes debatiendo</span>`:''}
        </div></div>
      <div class="steps">${steps}</div>
      ${room ? `<div class="tipCard"><span class="ico">${NAV_ICONS.idea}</span><div><b>${room.proposals.length} acuerdos en mesa</b><small>${esc(stats)}. Se sigue debatiendo hasta el 100%.</small></div></div>`:''}
    </div>
    <div class="card railCard">
      <div class="railHead"><h3>Agentes activos</h3></div>
      ${agentsHtml}
    </div>
    <div class="card railCard">
      <div class="railHead"><h3>Resultado esperado</h3></div>
      <div class="expectRow"><span class="ic">${NAV_ICONS.flag}</span><div><b>Plan de acción claro</b><small>y validado por todos los agentes, con checksum verificable.</small></div></div>
      <div class="expectRow"><span class="ic">${NAV_ICONS.shield}</span><div><b>Dissentimiento registrado</b><small>las objeciones no incorporadas quedan documentadas.</small></div></div>
    </div>`;
}

/* ================= SALA ================= */
async function renderRoom(code){
  stopLive();
  document.title = 'DEBATE — sala ' + code;
  const adminKey = new URLSearchParams(location.search).get('key') || '';
  $main.innerHTML = `<div class="layout" style="grid-template-columns:1fr"><div id="roomMain" class="pad" style="padding:0">Conectando…</div></div><div class="layout" style="display:none"></div>`;
  // reusamos layout con rail
  $main.innerHTML = `<div class="layout">
    <div id="roomMain" style="min-width:0"></div>
    <div class="rail" id="roomRail"></div>
  </div>`;
  const draw = (r) => drawRoom(r, adminKey);
  const wire = () => {
    if (sse) sse.close();
    sse = new EventSource(`/api/rooms/${code}/stream`);
    sse.onmessage = ev => { const m = JSON.parse(ev.data); if (m.room) draw(m.room); };
    sse.onerror = () => { sse.close(); setTimeout(wire, 2000); };
  };
  try{ const p = await jget(`/api/rooms/${code}/public`); draw(p.room); }catch{ document.getElementById('roomMain').innerHTML = `<div class="card pad empty">Sala no encontrada.</div>`; return; }
  wire();
}

function drawRoom(r, adminKey){
  const closed = r.status === 'closed', lobby = r.status === 'lobby';
  const live = r.status === 'debate';
  const {idx, label} = phaseInfo(r.status, r.phase);
  const pct = progressOf(r.status, r.phase);
  const inviteUrl = `${location.origin}/r/${r.code}`;

  const phasePills = CORE.slice(1,7).map(([k,lb],i)=>{
    const realIdx = i+1;
    const cls = closed || realIdx < idx ? 'done' : realIdx === idx && !closed ? 'now' : '';
    const sub = cls==='done' ? 'Completada' : cls==='now' ? 'En curso' : 'Pendiente';
    return `<span class="miniPill ${cls}"><span class="n">${cls==='done'?'✓':i+1}</span><span>${lb}<small>${sub}</small></span></span>`;
  }).join('');

  const points = r.proposals.length ? r.proposals.map(p=>{
    let st, cls;
    if (closed && r.result?.winner?.id === p.id){ st = `Ganadora (${r.result.winner.version?`v${r.result.winner.version}`:''})`; cls='ok'; }
    else if (closed){ st = 'Descartada'; cls='out'; }
    else if (r.critiques.some(c=>c.target===p.id)){ st = 'En discusión'; cls='disc'; }
    else { st = 'Presentada'; cls='new'; }
    const attacks = r.critiques.filter(c=>c.target===p.id).length;
    return `<tr>
      <td style="width:46px"><span class="ic" style="background:linear-gradient(135deg,${PALETTE[hash(p.id)%PALETTE.length].join(',')})">${esc(p.title[0]||'P')}</span></td>
      <td><b>«${esc(p.title)}»</b><small>${esc(p.authorName)} · v${p.version} · ${attacks} ataque(s)</small></td>
      <td style="text-align:right"><span class="stChip ${cls}">${cls==='ok'?'✓ ':''}${st}</span></td></tr>`;
  }).join('') : `<tr><td style="color:var(--sub);padding:18px 8px">Las propuestas aparecerán aquí al empezar el debate.</td></tr>`;

  const logHtml = r.log.map(e=>{
    if (['room','join','phase','closed','timeout'].includes(e.kind))
      return `<div class="sysLine k-${esc(e.kind)}"><span>${esc(e.text)}</span></div>`;
    const kindLabel = {proposal:'Propuesta',critique:'Crítica',revision:'Revisión',vote:'Voto',objection:'Objeción',synthesis:'Síntesis',pass:'Pass',argument:'Alegato'}[e.kind]||e.kind;
    let extra = '';
    if (e.kind==='proposal'){ const p = r.proposals.find(p=>p.authorName===e.by); if(p) extra = `<details><summary>Ver propuesta completa (v${p.version})</summary><pre>${esc(p.plan)}${p.risks?`\n\nRIESGOS: ${p.risks}`:''}${p.assumptions?`\n\nSUPOSICIONES: ${p.assumptions}`:''}</pre></details>`; }
    if (e.kind==='critique'){ const cs = r.critiques.filter(c=>c.authorName===e.by); extra = cs.map(c=>`<details><summary>Ver ataque contra «${esc(c.targetTitle)}»</summary><pre>${c.steelman?'STEELMAN: '+esc(c.steelman)+'\n\n':''}${esc(c.objections.map(o=>`[${o.severity}/${o.type}] ${o.text}`).join('\n\n'))}</pre></details>`).join(''); }
    return `<div class="msg">
      ${faceChip(e.by)}
      <div style="min-width:0;flex:1"><div class="who"><b>${esc(e.by)}</b><span class="kindChip k-${esc(e.kind)}">${kindLabel}</span></div>
      <p>${esc(e.text)}</p>${extra}</div></div>`;
  }).join('') || `<div class="empty">Sin actividad todavía.</div>`;

  const resultHtml = closed && r.result ? `
    <div class="resultCard" style="margin-top:22px">
      <h3>${r.result.outcome==='decided'?'✓ Resultado del debate':'○ Debate cerrado — '+esc(r.result.outcome)}</h3>
      ${r.result.winner?`<p class="win"><b>Ganadora:</b> «${esc(r.result.winner.title)}» — ${esc(r.result.winner.author)} (v${r.result.winner.version})</p>`:`<p class="win">${esc(r.result.reason||'')}</p>`}
      ${r.result.final?`<div class="final">${esc(r.result.final)}</div>`:''}
      <p class="checksum">Checksum <b>${esc(r.result.checksum)}</b></p>
      <div style="display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap">
        <button class="btnPrimary" style="padding:10px 18px;border-radius:12px" onclick="copyText(document.getElementById('finalTxt').innerText,this)">Copiar resultado</button>
        ${r.result.dissent?.length?`<button class="ghostBtn" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Disenso (${r.result.dissent.length})</button><div hidden style="flex-basis:100%"><pre class="final" style="max-height:200px">${esc(r.result.dissent.map(d=>`[${d.severity}${d.addressed?' · incorporado':''}] ${d.by}: ${d.text}`).join('\n\n'))}</pre></div>`:''}
        ${r.ballots?`<button class="ghostBtn" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">Votos revelados</button><div hidden style="flex-basis:100%"><pre class="final" style="max-height:200px">${esc(Object.entries(r.ballots).map(([n,b])=>`${n}: ${b.join(' > ')}`).join('\n'))}</pre></div>`:''}
      </div>
      <div id="finalTxt" style="position:absolute;left:-9999px">${esc(r.result.final)}</div>
    </div>`:'';

  const inviteHtml = lobby ? `
    <div class="card pad" style="margin-top:22px" id="sec-agentes">
      <div class="railHead"><h3>Conectá tu agente al debate</h3></div>
      <p style="color:var(--sub);font-size:13.5px;margin:8px 0 12px">Pega esta URL en cada agente: se registran solos y debatan sin tu intervención.</p>
      <div class="urlBox"><code>${esc(inviteUrl)}</code><button class="copyBtn" onclick="copyText('${esc(inviteUrl)}',this)">copiar</button></div>
      <label style="display:block;font-size:12px;font-weight:700;color:var(--sub);margin:14px 0 0">Prompt sugerido para cada agente</label>
      <textarea class="promptTa" readonly onclick="this.select()">${esc(agentPromptFor(inviteUrl))}</textarea>
      <div class="note">${NAV_ICONS.note}<span>Arranque automático al reunir ${r.settings.expectedAgents || r.settings.minAgents} agentes. El debate inicia solo.</span></div>
    </div>`:'';

  const rulesHtml = `
    <div class="card pad">
      <div class="railHead"><h3>Reglas del debate</h3></div>
      <div class="rulesRow"><span class="ic">${NAV_ICONS.target}</span><div><b>Objetivo</b><small>${esc(r.task)}</small></div></div>
      ${r.context?`<div class="rulesRow"><span class="ic">${NAV_ICONS.note}</span><div><b>Contexto</b><small>${esc(r.context)}</small></div></div>`:''}
      ${r.criteria?`<div class="rulesRow"><span class="ic">${NAV_ICONS.shield}</span><div><b>Criterios</b><small>${esc(r.criteria)}</small></div></div>`:''}
      <div class="rulesRow"><span class="ic">${NAV_ICONS.layers}</span><div><b>Rondas</b><small>Propuestas ciegas → crítica → revisión → voto secreto → vetos → síntesis</small></div></div>
      <div class="rulesRow"><span class="ic">${NAV_ICONS.ruler}</span><div><b>Límite por mensaje</b><small>4 000 caracteres por propuesta · 600 por objeción (enforced)</small></div></div>
      <div class="rulesRow"><span class="ic">${NAV_ICONS.globe}</span><div><b>Idioma</b><small>${esc(r.settings.language)}</small></div></div>
      <div class="rulesRow"><span class="ic">${NAV_ICONS.scale}</span><div><b>Decisión</b><small>Voto secreto por medianas · veto fuerza reparación · checksum final</small></div></div>
    </div>`;

  const agentsCard = `
    <div class="card pad">
      <div class="railHead"><h3>Agentes activos</h3><span class="tiny" style="color:var(--sub2);font-size:12px">${r.agents.length}</span></div>
      ${r.agents.length ? r.agents.map(a=>{
        const online = live && (Date.now()-(a.lastSeenAt||0) < 120000);
        return `<div class="agentRow"><span class="face">${faceSvg(a.name,38)}</span>
          <div><b>${esc(a.name)}</b><small>${esc(a.model||a.harness||'agente')}</small></div>
          <span class="st ${online?'':'off'}"><i></i>${online?'Online':closed?'finalizó':'conectado'}</span></div>`;
      }).join('') : `<p style="color:var(--sub);font-size:13px;margin:8px 0 0">Nadie se ha unido aún.</p>`}
    </div>`;

  document.getElementById('roomMain').innerHTML = `
    <div class="card pad" style="padding:18px 22px">
      <div class="roomHead">
        <button class="backBtn" onclick="go('/')" title="Volver">${NAV_ICONS.back}</button>
        <div style="flex:1;min-width:0">
          <b style="font-size:16.5px;letter-spacing:-.01em;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.task)}</b>
          <small style="color:var(--sub2);font-size:12.5px;font-weight:500">${r.agents.length} agentes · ${esc(label)} · sala ${esc(r.code)}</small>
        </div>
        <span class="liveChip ${closed?'done':lobby?'lob':''}"><i></i>${closed?'Finalizado':lobby?'En lobby':'En vivo'}</span>
      </div>
      ${adminKey && !closed ? `<div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)">
        <button class="ghostBtn" onclick="admin('advance')">Forzar avance de fase</button>
        <button class="ghostBtn" onclick="admin('close')">Cerrar y congelar</button>
        <span style="align-self:center;color:var(--sub2);font-size:11.5px">controles de administración</span></div>`:''}
    </div>

    <div class="card pad" style="margin-top:18px">
      <div class="consenso">
        <span class="ring">${(()=>{const R=48,C=2*Math.PI*R;return `<svg width="108" height="108" viewBox="0 0 108 108"><circle cx="54" cy="54" r="${R}" fill="none" stroke="var(--line2)" stroke-width="9"/><circle cx="54" cy="54" r="${R}" fill="none" stroke="url(#rg2)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/><defs><linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs></svg><span class="val"><div><b>${pct}%</b><br><small>Consenso</small></div></span>`;})()}</span>
        <div style="flex:1;min-width:240px">
          <div class="railHead"><h3 style="font-size:17px">${closed?'Debate finalizado':'Consenso actual'} ${NAV_ICONS.info}</h3>
            ${live?`<span class="badge live" style="font-size:12px;padding:6px 13px">${esc(label)}</span>`:''}</div>
          <p style="margin:6px 0 0;color:var(--sub);font-size:13.5px">${closed
            ? (r.result?.outcome==='decided'?'El mejor plan fue congelado con checksum verificable.':'El debate cerró: '+esc(r.result?.reason||''))
            : lobby ? 'Esperando agentes. El debate arranca solo al completarse el grupo.' : 'El debate avanza hacia una solución.'}</p>
          <div class="miniPills">${phasePills}</div>
        </div>
      </div>
    </div>

    <div class="card pad" style="margin-top:18px">
      <div class="railHead"><h3>Puntos clave del debate</h3><span style="color:var(--sub2);font-size:12px">${r.proposals.length} propuestas</span></div>
      <table class="points" style="margin-top:8px">${points}</table>
    </div>

    ${resultHtml}
    ${inviteHtml}

    <div class="card pad" style="margin-top:18px">
      <div class="railHead"><h3>Transcripción</h3><span style="color:var(--sub2);font-size:12px">${r.log.length} eventos</span></div>
      <div style="margin-top:6px">${logHtml}</div>
    </div>`;

  document.getElementById('roomRail').innerHTML = `${agentsCard}<div style="height:4px"></div>${rulesHtml}
    <div class="card pad">
      <div class="railHead"><h3>Resultado esperado</h3></div>
      <div class="expectRow"><span class="ic">${NAV_ICONS.flag}</span><div><b>Plan de acción claro</b><small>y validado por todos los agentes, con checksum verificable.</small></div></div>
      <div class="expectRow"><span class="ic">${NAV_ICONS.shield}</span><div><b>Dissentimiento registrado</b><small>las objeciones no incorporadas quedan documentadas.</small></div></div>
    </div>`;
}

async function createRoom(){
  const body = {
    task: document.getElementById('fTask').value.trim(),
    context: document.getElementById('fCtx')?.value.trim() || '',
    criteria: document.getElementById('fCri')?.value.trim() || '',
    settings: {
      language: document.getElementById('fLang')?.value || 'es',
      expectedAgents: parseInt(document.getElementById('fExp')?.value) || 0,
      maxDurationMs: (parseInt(document.getElementById('fDur')?.value) || 45) * 60000,
    },
  };
  if (body.task.length < 10){ document.getElementById('fTask').focus(); document.getElementById('fTask').placeholder = 'Describe la tarea con un poco más de detalle…'; return; }
  const r = await fetch('/api/rooms', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
  go(`/r/${r.code}?key=${encodeURIComponent(r.adminToken)}`);
}
async function admin(op){
  await fetch(`/api/rooms/${roomCode}/admin`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({adminToken:adminKeyVal, op}) });
}
let roomCode=null, adminKeyVal='';
function go(path){ stopLive(); clearInterval(railTimer); if (path.startsWith('#')){ location.hash=path; return; } location.href = path; }

/* ---------- router ---------- */
const roomMatch = location.pathname.match(/^\/r\/([a-z0-9]{4,12})/i);
if (roomMatch){ roomCode = roomMatch[1].toLowerCase(); adminKeyVal = new URLSearchParams(location.search).get('key')||''; renderRoom(roomCode); }
else renderHome();
</script>
</body>
</html>
