# Despliegue en Render (plan gratuito): servicio web Node, sin disco.
#
# El motor escribe en `data/` las salas, los workspaces y los repositorios de trabajo. En el plan
# gratuito ese directorio vive en el sistema de ficheros efímero de la instancia: vale para ver el
# panel y hacer un debate corto, pero cada reinicio —y cada vez que la instancia se duerme por 15
# minutos sin visitas— se lleva por delante lo que estuviera en curso.
#
# Sin pagar nada hay salida: la memoria durable publica salas y workspaces en un repo git privado
# y los rehidrata al arrancar, asi que el trabajo vuelve aunque el disco se borre (README, 12).
# Se configura en el panel (Environment):
#
#   AGORA_MEMORY_REPO   tu-usuario/polymind-memoria
#   AGORA_MEMORY_TOKEN  token con permiso de escritura en ese repo
#
# Para trabajo de verdad, cambia a instancia de pago y anade el disco:
#
#   plan: starter
#   envVars:
#     - key: AGORA_DATA
#       value: /var/agora-data
#   disk:
#     name: polymind-data
#     mountPath: /var/agora-data
#     sizeGB: 2
services:
  - type: web
    name: polymind
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # El proxy puede cerrar una petición antes que el long-poll de 120 s: con 30 s el turno
      # vuelve siempre por su propio pie y el manual dice lo mismo que el servidor cumple.
      - key: AGORA_MAX_WAIT_SEC
        value: "30"
      # Memoria durable (opcional): descomenta y rellena para que el trabajo no se pierda
      # cuando la instancia se duerme o se redespliega.
      # - key: AGORA_MEMORY_REPO
      #   sync: false
      # - key: AGORA_MEMORY_TOKEN
      #   sync: false
